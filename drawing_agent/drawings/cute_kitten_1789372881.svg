<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kittenBodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eyeHighlight" cx="30%" cy="30%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Body -->
  <ellipse cx="400" cy="400" rx="150" ry="100" fill="url(#kittenBodyGradient)" stroke="#ccc" stroke-width="2"/>

  <!-- Head -->
  <circle cx="400" cy="280" r="100" fill="url(#kittenBodyGradient)" stroke="#ccc" stroke-width="2"/>

  <!-- Ears -->
  <path d="M330 200 L370 180 L380 250 Z" fill="url(#kittenBodyGradient)" stroke="#ccc" stroke-width="2"/>
  <path d="M470 200 L430 180 L420 250 Z" fill="url(#kittenBodyGradient)" stroke="#ccc" stroke-width="2"/>
  <path d="M340 210 L360 200 L365 240 Z" fill="#f5e0e0"/>
  <path d="M460 210 L440 200 L435 240 Z" fill="#f5e0e0"/>

  <!-- Eyes -->
  <circle cx="370" cy="270" r="25" fill="#6a5acd" stroke="#333" stroke-width="2"/>
  <circle cx="430" cy="270" r="25" fill="#6a5acd" stroke="#333" stroke-width="2"/>
  <circle cx="375" cy="265" r="10" fill="url(#eyeHighlight)"/>
  <circle cx="435" cy="265" r="10" fill="url(#eyeHighlight)"/>

  <!-- Nose -->
  <path d="M400 295 L395 305 L405 305 Z" fill="#f7cac9"/>

  <!-- Mouth -->
  <path d="M400 305 Q390 315 395 325" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M400 305 Q410 315 405 325" stroke="#333" stroke-width="1" fill="none"/>

  <!-- Whiskers -->
  <line x1="340" y1="300" x2="300" y2="290" stroke="#555" stroke-width="1"/>
  <line x1="340" y1="305" x2="300" y2="305" stroke="#555" stroke-width="1"/>
  <line x1="340" y1="310" x2="300" y2="320" stroke="#555" stroke-width="1"/>
  <line x1="460" y1="300" x2="500" y2="290" stroke="#555" stroke-width="1"/>
  <line x1="460" y1="305" x2="500" y2="305" stroke="#555" stroke-width="1"/>
  <line x1="460" y1="310" x2="500" y2="320" stroke="#555" stroke-width="1"/>

  <!-- Paws (front) -->
  <ellipse cx="350" cy="480" rx="40" ry="30" fill="url(#kittenBodyGradient)" stroke="#ccc" stroke-width="2"/>
  <ellipse cx="450" cy="480" rx="40" ry="30" fill="url(#kittenBodyGradient)" stroke="#ccc" stroke-width="2"/>
</svg>