<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD0C4" />
      <stop offset="100%" stop-color="#FFD1DC" />
    </linearGradient>
    <radialGradient id="eyeHighlight" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ADD8E6" />
    </radialGradient>
  </defs>

  <!-- Background elements - soft patterned wall and floor -->
  <rect x="0" y="0" width="800" height="350" fill="#F0F8FF" />
  <rect x="0" y="350" width="800" height="250" fill="#FDF5E6" />
  <circle cx="100" cy="100" r="20" fill="#E6E6FA" opacity="0.5" />
  <circle cx="700" cy="80" r="15" fill="#E6E6FA" opacity="0.5" />
  <path d="M0 350 L800 350" stroke="#DCDCDC" stroke-width="2" opacity="0.7" />

  <!-- Kitten's body -->
  <ellipse cx="400" cy="420" rx="180" ry="150" fill="url(#furGradient)" stroke="#FFB6C1" stroke-width="3" />

  <!-- Head -->
  <circle cx="400" cy="280" r="120" fill="url(#furGradient)" stroke="#FFB6C1" stroke-width="3" />

  <!-- Ears -->
  <path d="M320 200 L370 160 L420 200 Z" fill="url(#furGradient)" stroke="#FFB6C1" stroke-width="2" />
  <path d="M340 190 L370 170 L400 190 Z" fill="#FFF0F5" />
  <path d="M480 200 L430 160 L380 200 Z" fill="url(#furGradient)" stroke="#FFB6C1" stroke-width="2" />
  <path d="M460 190 L430 170 L400 190 Z" fill="#FFF0F5" />

  <!-- Eyes -->
  <circle cx="350" cy="270" r="35" fill="#FFFFFF" />
  <circle cx="450" cy="270" r="35" fill="#FFFFFF" />
  <circle cx="350" cy="270" r="20" fill="#4682B4" />
  <circle cx="450" cy="270" r="20" fill="#4682B4" />
  <circle cx="340" cy="260" r="10" fill="url(#eyeHighlight)" opacity="0.8" />
  <circle cx="440" cy="260" r="10" fill="url(#eyeHighlight)" opacity="0.8" />
  <circle cx="345" cy="275" r="8" fill="#000000" />
  <circle cx="445" cy="275" r="8" fill="#000000" />

  <!-- Nose -->
  <path d="M400 310 L390 325 L410 325 Z" fill="#FFC0CB" stroke="#E0BBE4" stroke-width="1" />

  <!-- Mouth (simple curve) -->
  <path d="M380 340 Q400 355 420 340" stroke="#FFC0CB" stroke-width="2" fill="none" />

  <!-- Paws (front) -->
  <ellipse cx="320" cy="500" rx="50" ry="30" fill="url(#furGradient)" stroke="#FFB6C1" stroke-width="2" />
  <ellipse cx="480" cy="500" rx="50" ry="30" fill="url(#furGradient)" stroke="#FFB6C1" stroke-width="2" />

  <!-- Tail -->
  <path d="M500 450 Q550 400 600 450 Q580 500 500 480 Z" fill="url(#furGradient)" stroke="#FFB6C1" stroke-width="2" />
</svg>